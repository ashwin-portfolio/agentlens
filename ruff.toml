# Single shared config at the repo root — applies to sdk/ and server/ (neither
# defines its own [tool.ruff]), so both packages lint identically in CI and locally.
line-length = 100
target-version = "py310"

[lint]
select = ["E", "W", "F", "I", "B", "UP"]

[lint.isort]
known-first-party = ["agentlens", "app"]
