# TODO(roadmap): add server and dashboard services once they have working
# images (server after Week 1, dashboard after Week 4 — docs/05-ROADMAP.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentlens
      POSTGRES_PASSWORD: agentlens
      POSTGRES_DB: agentlens
    ports:
      # Host 5433 to avoid clashing with a local Postgres (docs/06-GETTING-STARTED.md).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlens -d agentlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
